<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex005</title>

    <style>
        body{
            background-color: blue;
            color: white;
            font: normal 18pt Arial;
        }
    </style>
</head>
<body>
    <h1>Iniciando estudos DOM</h1>
    <p id="p1">Aqui vai o resultado</p>
    <p id="p2">Aprendendo a usar o <strong> DOM </strong> em JavaScript.</p>
    <div>Clique aqui em mim</div>
    <script>
        var corpo = window.document.body
        var p1 = window.document.getElementById('p2')
        window.document.write('Está escrito assim : '+ p1.innerText)
        corpo.style.color = 'pink'
        window.alert(p1.innerText)
    </script>
</body>
</html>
